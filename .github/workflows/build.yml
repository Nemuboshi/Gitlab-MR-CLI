name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check
        run: cargo check --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare artifact bundle
        run: |
          mkdir -p artifact/dist
          cp target/release/gitlab-mr-cli artifact/dist/gitlab-mr-cli
          cp README.md artifact/README.md
          cp gitlab-mr-cli.toml.example artifact/gitlab-mr-cli.toml.example

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-mr-cli-dist
          path: artifact

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_name: gitlab-mr-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_name: gitlab-mr-cli.exe
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            binary_name: gitlab-mr-cli
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary_name: gitlab-mr-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          archive_base="gitlab-mr-cli-${version}-${{ matrix.target }}"
          package_dir="package"
          mkdir -p "${package_dir}"
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} "${package_dir}/${{ matrix.binary_name }}"
          cp gitlab-mr-cli.toml.example "${package_dir}/gitlab-mr-cli.toml.example"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd "${package_dir}" && 7z a "../${archive_base}.zip" .)
          else
            tar -C "${package_dir}" -czf "${archive_base}.tar.gz" .
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: gitlab-mr-cli-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
