[package]
name = "gitlab-mr-cli"
version = "0.1.0"
edition = "2024"
description = "Thin GitLab MR discussion tooling with a standalone Rust CLI."
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread"] }
toml = "0.8"
urlencoding = "2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
